<style>.seg .opt{flex:none}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="navgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
  <symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="url(#lg)"/><circle cx="50" cy="14" r="4" fill="#fff" opacity=".9"/><path d="M22 16h13a9 9 0 0 1 4.5 16.8A9.5 9.5 0 0 1 35.5 50H22z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M22 33h13" stroke="#fff" stroke-width="5"/></symbol>
</defs></svg>

<div id="lock">
  <form class="lockbox" id="lockform" autocomplete="off">
    <svg class="logo"><use href="#logo"/></svg>
    <h1>Borna HQ</h1>
    <p>Private dashboard · enter your password</p>
    <input id="pw" type="password" placeholder="••••••" autocomplete="current-password" aria-label="Password" required>
    <button class="btn" id="unlock" type="submit">Unlock</button>
    <label class="remember"><input type="checkbox" id="rem" checked> Remember on this device</label>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="wrap topin">
      <svg class="logo"><use href="#logo"/></svg>
      <div class="brand"><b>Borna HQ</b><small id="updated">—</small></div>
      <nav class="tabs" id="tabs"></nav>
      <button class="iconbtn" id="mic" title="Talk to Claude" aria-label="Talk to Claude"></button>
      <button class="iconbtn" id="refresh" title="Reload" aria-label="Reload data"></button>
      <button class="iconbtn" id="settings" title="Settings" aria-label="Settings"></button>
    </div>
  </header>
  <main class="wrap">
    <section class="page" id="p-today"></section>
    <section class="page" id="p-me"></section>
    <section class="page" id="p-shop"></section>
    <section class="page" id="p-tasks"></section>
    <section class="page" id="p-calendar"></section>
    <section class="page" id="p-social"></section>
    <section class="page" id="p-growth"></section>
    <section class="page" id="p-business"></section>
    <section class="page" id="p-projects"></section>
    <section class="page" id="p-money"></section>
    <section class="page" id="p-people"></section>
    <p class="foot" id="foot"></p>
  </main>
  <button class="fab" id="fab" aria-label="Add"></button>
  <nav class="bottom" id="bottom"></nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>
</div>

</body>
</html>
